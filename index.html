<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BalkanBite - AI Smart Pantry & Healthy Recipes</title>
    <meta name="description" content="Smart AI pantry tracker, healthy balanced recipes, and intelligent grocery planner tailored to your budget and tastes." />
    <meta property="og:title" content="BalkanBite - AI Smart Pantry & Healthy Recipes" />
    <meta property="og:description" content="Smart AI pantry tracker, healthy balanced recipes, and intelligent grocery planner tailored to your budget and tastes." />
    <meta property="og:image" content="/images/logo.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="google-site-verification" content="4hG7LsR0N434Ef2FOergejiXhNu4HKk9dwM_-HRIPkg" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BalkanBite" />
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module">
      const root = document.getElementById('root');
      let bootFailureShown = false;

      const formatFailure = (value) => {
        if (!value) return 'Unknown frontend boot error';
        if (value instanceof Error) return value.stack || value.message || String(value);
        if (typeof value === 'string') return value;
        try { return JSON.stringify(value); } catch { return String(value); }
      };

      const showBootFailure = (kind, value) => {
        if (bootFailureShown || !root || root.childElementCount > 0) return;
        bootFailureShown = true;
        const detail = formatFailure(value).slice(0, 4000);
        document.documentElement.dataset.bbBoot = 'failed';
        document.documentElement.dataset.bbBootKind = kind;
        const panel = document.createElement('pre');
        panel.id = 'bb-boot-error';
        panel.style.cssText = 'box-sizing:border-box;margin:0;padding:16px;min-height:100vh;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;color:#991b1b;font:13px/1.5 monospace;';
        panel.textContent = `BalkanBite frontend boot failure (${kind})\n\n${detail}`;
        root.replaceChildren(panel);
      };

      window.addEventListener('error', (event) => {
        // Only surface errors that leave the app completely unmounted. External
        // widgets can fail independently without taking BalkanBite down.
        window.setTimeout(() => {
          if (root && root.childElementCount === 0) {
            showBootFailure('window-error', event.error || event.message);
          }
        }, 0);
      });
      window.addEventListener('unhandledrejection', (event) => {
        window.setTimeout(() => {
          if (root && root.childElementCount === 0) {
            showBootFailure('unhandled-rejection', event.reason);
          }
        }, 0);
      });

      document.documentElement.dataset.bbBoot = 'loading';
      import('/src/main.tsx')
        .then(() => {
          window.setTimeout(() => {
            if (root && root.childElementCount > 0) {
              document.documentElement.dataset.bbBoot = 'mounted';
            } else {
              showBootFailure('empty-root-after-module', 'The application module loaded, but React did not mount any UI.');
            }
          }, 2500);
        })
        .catch((error) => showBootFailure('module-import', error));
    </script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch((err) => {
            console.log('SW registration skipped or error:', err);
          });
        });
      }
    </script>
  </body>
</html>
