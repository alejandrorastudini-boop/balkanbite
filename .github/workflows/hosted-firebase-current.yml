name: Hosted Production target preflight

on:
  push:
    branches:
      - 'qa/hosted-firestore-run-*'
    paths:
      - "qa/runtime/hosted-run-request.json"

permissions:
  contents: read

concurrency:
  group: balkanbite-hosted-target-preflight
  cancel-in-progress: false

jobs:
  hosted-target-preflight:
    if: startsWith(github.ref, 'refs/heads/qa/hosted-firestore-run-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout QA-only harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify one-time opt-in, deployed commit and exact named database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node qa/runtime/validate-hosted-run-request.mjs
