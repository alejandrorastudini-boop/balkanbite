name: Firestore rules emulator

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "qa/security/**"
      - "src/utils/confirmedCookFirestore.ts"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Configure Java 21 for Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install isolated rules QA tools
        run: >
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1

      - name: Test rules against offline emulator only
        env:
          CI: "true"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
        run: >
          npx --no-install firebase emulators:exec
          --only firestore
          --project demo-balkanbite-rules
          --config firebase.json
          "node qa/security/firestore-rules-emulator.mjs && node --import tsx qa/security/cook-journal-transaction-emulator.mjs"
