name: BalkanBite named Firestore rules release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only inspection or checked-in release request"
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - publish
  push:
    branches:
      - main
    paths:
      - "ops/firebase-rules-release-request.json"

permissions:
  contents: read

concurrency:
  group: balkanbite-named-firestore-release
  cancel-in-progress: false

jobs:
  named-firestore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Configure Java 21 for isolated rules verification
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install isolated verification and authentication tools
        run: >
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1
          google-auth-library@10.9.1

      - name: Check release code and fail-closed invariants
        run: |
          node --check qa/security/firestore-release-github.mjs
          node --test qa/security/firestore-release-core.test.mjs

      - name: Verify all owner rules in offline Firestore emulator
        env:
          CI: "true"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
        run: >
          npx --no-install firebase emulators:exec
          --only firestore
          --project demo-balkanbite-rules
          --config firebase.json
          "node qa/security/firestore-rules-emulator.mjs"

      - name: Verify one-time Google credential is configured
        env:
          FIREBASE_RULES_SA_JSON: ${{ secrets.FIREBASE_RULES_SA_JSON }}
        run: |
          if [ -z "$FIREBASE_RULES_SA_JSON" ]; then
            echo "::error::Configure FIREBASE_RULES_SA_JSON in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Authenticate to Google without exposing the secret
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.FIREBASE_RULES_SA_JSON }}'
          project_id: gen-lang-client-0319723351
          create_credentials_file: true
          cleanup_credentials: true

      - name: Inspect or publish ONLY the named BalkanBite database
        env:
          BB_RELEASE_MODE: ${{ inputs.mode }}
        run: node qa/security/firestore-release-github.mjs

      - name: Retain original rules for verified rollback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: named-firestore-rules-before-${{ github.run_id }}
          path: ${{ runner.temp }}/balkanbite-rules-backup/*.json
          if-no-files-found: warn
          retention-days: 30
