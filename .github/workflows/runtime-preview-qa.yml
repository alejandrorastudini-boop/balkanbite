name: BalkanBite Runtime Preview QA

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Protected Vercel preview URL to validate"
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: runtime-preview-qa-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: true

jobs:
  startup-cloud-sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        startsWith(github.event.deployment.ref, 'preview/qa-')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Resolve preview URL
        env:
          DISPATCH_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          URL="${DISPATCH_URL:-$DEPLOYMENT_URL}"
          if [ -z "$URL" ]; then
            echo "No Vercel preview URL was supplied by the deployment event." >&2
            exit 1
          fi
          echo "QA_PREVIEW_URL=$URL" >> "$GITHUB_ENV"

      - name: Mint GitHub Actions OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Install Playwright runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run startup cloud-sync runtime acceptance
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          QA_ARTIFACT_DIR: artifacts/runtime-qa
          QA_EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: node qa/runtime/startup-cloud-sync.mjs

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-cloud-sync-runtime-${{ github.run_id }}
          path: artifacts/runtime-qa
          if-no-files-found: warn
          retention-days: 14
