name: Verify safe shopping reconciliation v2

on:
  push:
    branches:
      - verify/safe-shopping-reconciliation-final-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
